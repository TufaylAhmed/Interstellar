[workspace]
resolver = "2"
members = [
    "crates/interstellar-ir",
    "crates/interstellar-parse",
    "crates/interstellar-emit",
    "crates/interstellar-analyze",
    "crates/interstellar-api",
    "crates/interstellar-cli",
]
default-members = ["crates/interstellar-cli"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "UNLICENSED"
authors = ["Tufail Ahmed Sheikh"]

[workspace.dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["multipart"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
quick-xml = { version = "0.37", features = ["serialize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

interstellar-ir = { path = "crates/interstellar-ir" }
interstellar-parse = { path = "crates/interstellar-parse" }
interstellar-emit = { path = "crates/interstellar-emit" }
interstellar-analyze = { path = "crates/interstellar-analyze" }
interstellar-api = { path = "crates/interstellar-api" }
