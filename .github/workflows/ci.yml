name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test
        run: cargo test --workspace
      - name: Release build
        run: cargo build --release
      - name: Fixture convert
        shell: bash
        run: |
          BIN=./target/release/interstellar
          if [[ -f ./target/release/interstellar.exe ]]; then BIN=./target/release/interstellar.exe; fi
          mkdir -p out
          "$BIN" convert fixtures/fortinet/sample.conf -o out/is-fg.xml
          "$BIN" convert fixtures/junos/sample.set --vendor juniper -o out/is-junos.xml
          "$BIN" analyze fixtures/cisco/sample.cfg --format markdown -o out/is-report.md
          "$BIN" diff fixtures/fortinet/sample.conf fixtures/cisco/sample.cfg -o out/is-diff.json
