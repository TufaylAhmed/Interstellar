ASA Version 9.12(4)
!
hostname fw1
!
object network WEB
 host 10.1.1.10
object network USERS
 subnet 10.0.0.0 255.255.255.0
object network DMZ_RANGE
 range 10.3.0.1 10.3.0.20
object-group network INTERNAL
 network-object object USERS
 network-object object WEB
object service HTTPS
 service tcp destination eq 443
object-group service WEB_PORTS
 service-object tcp destination eq 80
 service-object object HTTPS
!
access-list OUTSIDE_IN extended permit tcp object USERS object WEB eq 443
access-list OUTSIDE_IN extended permit ip object-group INTERNAL any
access-list OUTSIDE_IN extended deny ip any any
!
nat (inside,outside) source static USERS USERS
nat (outside,dmz) destination static WEB WEB
!
