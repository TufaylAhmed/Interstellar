#config-version=FG100F-7.4.4-FW-build2662-240514:opmode=0:vdom=0
config system global
    set hostname "fg-lab"
end
config firewall address
    edit "Web_Server"
        set subnet 10.1.1.10 255.255.255.255
    next
    edit "Corp_Users"
        set subnet 10.0.0.0 255.255.255.0
    next
    edit "Guest_Range"
        set type iprange
        set start-ip 10.2.0.1
        set end-ip 10.2.0.50
    next
end
config firewall addrgrp
    edit "Internal"
        set member "Corp_Users" "Web_Server"
    next
end
config firewall service custom
    edit "HTTP_ALT"
        set tcp-portrange 8080
    next
end
config firewall service group
    edit "Web_Services"
        set member "HTTP_ALT"
    next
end
config firewall vip
    edit "VIP_Web"
        set extip 203.0.113.10
        set mappedip "10.1.1.10"
        set extintf "wan1"
    next
end
config firewall ippool
    edit "WAN_POOL"
        set startip 203.0.113.20
        set endip 203.0.113.20
    next
end
config firewall profile-group
    edit "strict"
        set av-profile "default"
        set ips-sensor "default"
        set webfilter-profile "default"
    next
end
config firewall policy
    edit 1
        set name "Allow_Web"
        set srcintf "internal"
        set dstintf "wan1"
        set srcaddr "Corp_Users"
        set dstaddr "Web_Server"
        set action accept
        set service "HTTP_ALT" "ALL"
        set schedule "always"
        set profile-group "strict"
    next
    edit 2
        set name "Deny_All"
        set srcintf "any"
        set dstintf "any"
        set srcaddr "all"
        set dstaddr "all"
        set action deny
        set service "ALL"
    next
end
config vpn ipsec phase1-interface
    edit "to_branch"
        set interface "wan1"
        set remote-gw 198.51.100.1
        set psksecret "redacted"
        set ike-version 2
    next
end
config vpn ipsec phase2-interface
    edit "to_branch_p2"
        set phase1name "to_branch"
        set src-subnet 10.0.0.0/24
        set dst-subnet 10.10.0.0/24
    next
end
